[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantdata"
version = "0.1.0"
description = "Quantitative data utilities."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Hans Buehler" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "wrds>=3.2.0",
    "massive>=2.5.0",
    "yfinance>=1.3.0",
    "polars>=1.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas_market_calendars>=4.4.0",
    "click>=8.1.0",
    "torch",
    "wandb",
    "cvxpy",
    "cdxcore",
    "pyarrow",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0.0",
  "ruff>=0.5",
  "sphinx>=7.4",
  "jupyterlab",
  "ipykernel",
  "ipynbname"
]
docs = [
  "sphinx>=7.4",
]
test = [
  "pytest>=8.2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["quantdata*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["I"]